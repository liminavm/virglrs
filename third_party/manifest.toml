# The reference C renderer, pinned.
#
# virglrs is the rewrite; this is what it was written against and what the harness records its
# goldens from. It is not optional scaffolding — `build.rs` generates the format tables from its
# `virgl_hw.h` and from Mesa's `u_format.yaml` beside it, and the venus wire is generated from
# the venus-protocol its meson wrap pins. A tree without it does not build.
#
# One pin, not two: venus-protocol's revision lives in the C tree's
# `subprojects/venus-protocol.wrap`, and is materialized inside the clone. Pinning it here as
# well would be two records of one revision, free to disagree.
#
# Bumping it = push the new fork head, then update `rev` here in the same commit.
[virglrenderer]
repo = "https://github.com/liminavm/virglrenderer.git"
upstream = "https://gitlab.freedesktop.org/virgl/virglrenderer.git"
branch = "limina"
rev = "a649897ffcb0dd080bbee8e654bbdb549d2be80c"

# The reference leg on Linux, and only there.
#
# Two trees, two jobs. The fork above is the **build input** on every host: `build.rs` generates
# the wire numbering from its `virgl_hw.h`, which carries two cap bits upstream does not
# (VIRGL_CAP_V2_VIDEO_GUEST_PLANES, VIRGL_CAP_V2_VIDEO_PLANAR_TARGET), so swapping it per host
# would make virglrs a different renderer on each -- which is not a thing this project has.
#
# This tree is the **leg the harness scores against**, needed only on Linux. The fork does not
# compile off Darwin: its IOSurface fields and five of its functions are declared under
# `#ifdef __APPLE__` while a dozen uses of them are not guarded at all. That is a fork bug worth
# fixing, but it is not on the path to a Linux score, and upstream is the better oracle here
# regardless -- it is what a distribution ships and what a Linux VMM will meet.
#
# What it costs, recorded rather than discovered later: virglrs advertises those two cap bits and
# an upstream leg does not, so a caps comparison on Linux differs in exactly those two, both video
# and both moot until a VA-API backend exists.
#
# Materialized by `scripts/build-reference.sh`, not `vendor.sh`: vendor.sh brings in what the
# crate is built from, and this is not that.
[virglrenderer-upstream]
repo = "https://gitlab.freedesktop.org/virgl/virglrenderer.git"
rev = "cf6c62da2a1384b194f463e6221371962fe99575"

# libva's headers, for type-checking the Linux build on macOS, and only for that.
#
# The VA-API backend's bindings are generated from them by cros-libva's build script, which a Mac
# has no libva to feed. `scripts/cross-check-linux.sh` materializes this into third_party/libva and
# lays the headers out the way an install does. Nothing is linked against it and nothing runs.
#
# The rev is the libva goiaba builds against (Fedora 44's 2.23.0, VA-API 1.23): cros-libva gates
# parts of its API on the version it reads, so a different one would type-check a different crate.
[libva]
repo = "https://github.com/intel/libva.git"
rev = "dbf83dc3b1ce6bad46e1628aaf2da5ef731157b8"
