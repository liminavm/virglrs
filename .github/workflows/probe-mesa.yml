#
# THROWAWAY, and the follow-on to probe-metal.yml. That one answered "does a hosted runner
# have a working GPU" — yes, an Apple Paravirtual device that rasterizes. This one asks the
# question that actually decides where the C tree's `tests/` live: does the stack ABOVE Metal
# stand up there?
#
# The tightest constraint is not the build, it is KosmicKrisp. Metal rasterizing and MoltenVK
# enumerating say nothing about KK, which is a different codebase and may want Metal features a
# paravirtual device does not report. So KK gets its own step, as early as the build allows.
#
# The chain, and why each link is here:
#   case-sensitive volume  APFS cannot check out mesa (two files differing only in case)
#   zink-on-KK Mesa        vrend's host GL; the big build
#   eglprobe               surfaceless EGL + GLES clear + glReadPixels — the payload
#   epoxy with EGL         Homebrew's is CGL-only, and virglrenderer then silently builds
#                          without EGL, which is a renderer that cannot bring up host GL
#   virglrenderer          configured exactly as scripts/build-reference.sh does
#   vrendprobe             virgl_renderer_init() + a VIRGL2 capset
#   meson test             the C's own tests/ — the roadmap's step 2
#
# The probes are limina's (`spikes/virgl-zink-kk`), cloned rather than copied: they are the ones
# known to work on this stack, and forking them here would fork their licence too.
#
# Armed locally before landing, against the same prefix CI builds. eglprobe passes on
# zink Vulkan 1.4(MESA_KOSMICKRISP) reading back (0,128,255,255); pointed at a nonexistent ICD it
# fails at eglInitialize with VK_ERROR_INCOMPATIBLE_DRIVER. There is no software fallback
# underneath, so a PASS here means KosmicKrisp and cannot mean anything else.
#
# Steps are ordered and none is continue-on-error: where it stops IS the answer, and the
# per-step status says where that was.
#
# Delete this and probe-metal.yml together once they have answered.
name: Probe — Mesa/zink/KosmicKrisp on a hosted runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The literal paths the local builds use. The installed prefix bakes absolute install names
  # (libEGL -> libgallium by full path), so building where the developer builds is what lets a
  # cached prefix be restored later without install_name_tool. That is the caching design's
  # problem, not this probe's, but the path choice is made here.
  MESA_CS: /Volumes/mesa-cs
  MESA_PREFIX: /Volumes/mesa-cs/zink-kk-prefix
  MESA_REV: 5e99e7c1763
  EPOXY_REV: d1f952c

jobs:
  stack:
    name: Does the zink-on-KK stack build and render?
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Check out virglrs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Survey the runner
        run: |
          sw_vers
          sysctl -n hw.ncpu hw.memsize
          df -h /
          # If the boot volume were already case-sensitive the image below would be
          # unnecessary. It will not be, but the probe should report rather than assume.
          diskutil info / | grep -i 'File System Personality\|Case' || true

      - name: Make a case-sensitive volume
        run: |
          # Sparse, so it costs what it uses rather than its nominal size.
          hdiutil create -type SPARSE -fs 'Case-sensitive APFS' \
              -volname mesa-cs -size 12g /tmp/mesa-cs.sparseimage
          hdiutil attach /tmp/mesa-cs.sparseimage
          df -h "$MESA_CS"

      - name: Install build dependencies
        run: |
          # llvm and bison are keg-only and both are required: KosmicKrisp pulls in CLC and so
          # LLVM, and Mesa's glcpp grammar needs bison > 2.3 where Apple ships 2.3 from 2008.
          time brew install meson ninja bison llvm expat molten-vk glslang \
                            spirv-tools vulkan-loader vulkan-tools check pkgconf
          brew list --versions llvm bison molten-vk glslang spirv-tools vulkan-loader

      - name: Set up Mesa's codegen environment
        run: |
          python3 -m venv /tmp/venv-mesa
          /tmp/venv-mesa/bin/pip install --quiet mako pyyaml packaging
          /tmp/venv-mesa/bin/pip list

      - name: Clone Mesa at the pinned revision
        run: |
          # Shallow: the local checkout is 2.0G and almost all of it is history.
          mkdir -p "$MESA_CS/mesa"
          cd "$MESA_CS/mesa"
          git init -q
          git fetch --depth 1 -q https://github.com/liminavm/mesa.git "$MESA_REV"
          git checkout -q FETCH_HEAD
          git log --oneline -1
          df -h "$MESA_CS"

      - name: Build zink-on-KosmicKrisp Mesa
        run: |
          source /tmp/venv-mesa/bin/activate
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix llvm)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:$(brew --prefix expat)/lib/pkgconfig"
          # Verbatim from limina's spikes/virgl-zink-kk/build-mesa-zink-kk.sh. Its comments
          # carry why each of these is not the default; do not tidy them here.
          time meson setup "$MESA_CS/build-zink-kk" "$MESA_CS/mesa" \
              -Dplatforms=macos \
              -Dvulkan-drivers=kosmickrisp \
              -Dgallium-drivers=zink \
              -Dopengl=true \
              -Dgles2=enabled \
              -Degl=enabled \
              -Degl-native-platform=surfaceless \
              -Dglx=disabled \
              -Dglvnd=disabled \
              -Dshared-llvm=enabled \
              -Dzstd=disabled \
              -Dprefer_static=true \
              -Dbuildtype=debugoptimized \
              -Dmoltenvk-dir="$(brew --prefix molten-vk)" \
              --prefix "$MESA_PREFIX"
          # Timed: the caching design needs to know what a cold build costs on 3 cores.
          time ninja -C "$MESA_CS/build-zink-kk"
          meson install -C "$MESA_CS/build-zink-kk"
          du -sh "$MESA_PREFIX" "$MESA_CS/build-zink-kk"
          ls "$MESA_PREFIX/lib"
          df -h "$MESA_CS" /

      # The load-bearing step. Everything above is mechanical; this is the one that can say no
      # for a reason no amount of build engineering would fix.
      - name: Does KosmicKrisp initialize on a paravirtual device?
        run: |
          export VK_DRIVER_FILES="$MESA_PREFIX/share/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json"
          [ -f "$VK_DRIVER_FILES" ] || { echo "FAIL: KK ICD not installed"; exit 1; }
          # DYLD_* is set inside the body on purpose: /bin/bash is SIP-restricted and strips it
          # at launch, so a `env:` block above would never reach the process that needs it.
          export DYLD_LIBRARY_PATH="$MESA_PREFIX/vulkan-rpath"
          mkdir -p "$MESA_PREFIX/vulkan-rpath"
          ln -sf "$(brew --prefix)/lib/libvulkan.1.dylib" "$MESA_PREFIX/vulkan-rpath/"
          vulkaninfo --summary

      - name: Clone limina's probes
        run: |
          git clone --depth 1 -q https://github.com/liminavm/limina.git /tmp/limina
          ls /tmp/limina/spikes/virgl-zink-kk/*.c

      # The payload, and the same discipline as the Metal probe: a context that comes up is not
      # a rendered pixel. eglprobe clears to a known colour and reads it back.
      - name: Render through zink-on-KK
        run: |
          cc -o /tmp/eglprobe /tmp/limina/spikes/virgl-zink-kk/eglprobe.c \
              -I"$MESA_PREFIX/include" -L"$MESA_PREFIX/lib" -lEGL -lGLESv2 \
              -Wl,-rpath,"$MESA_PREFIX/lib"
          export VK_DRIVER_FILES="$MESA_PREFIX/share/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json"
          export DYLD_LIBRARY_PATH="$MESA_PREFIX/vulkan-rpath"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"
          export MESA_LOADER_DRIVER_OVERRIDE=zink
          export GALLIUM_DRIVER=zink
          export LIBGL_DRIVERS_PATH="$MESA_PREFIX/lib/dri:$MESA_PREFIX/lib"
          export EGL_PLATFORM=surfaceless
          export __EGL_VENDOR_LIBRARY_DIRS="$MESA_PREFIX/share/glvnd/egl_vendor.d"
          /tmp/eglprobe

      - name: Build epoxy with EGL
        run: |
          git clone -q https://github.com/anholt/libepoxy /tmp/libepoxy
          git -C /tmp/libepoxy checkout -q "$EPOXY_REV"
          export PKG_CONFIG_PATH="$MESA_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig"
          # -Degl=yes because epoxy auto-disables EGL on darwin, which is the silent failure
          # scripts/build-reference.sh checks for by name.
          meson setup /tmp/libepoxy/build-egl /tmp/libepoxy \
              -Degl=yes -Dglx=no -Dx11=false -Dtests=false \
              --prefix "$GITHUB_WORKSPACE/third_party/epoxy-egl-prefix" --buildtype release
          ninja -C /tmp/libepoxy/build-egl
          meson install -C /tmp/libepoxy/build-egl
          grep -i epoxy_has_egl "$GITHUB_WORKSPACE/third_party/epoxy-egl-prefix/lib/pkgconfig/epoxy.pc"

      - name: Build the reference C renderer
        run: |
          ./scripts/vendor.sh
          time ./scripts/build-reference.sh

      - name: Does virgl_renderer_init come up?
        run: |
          cc -o /tmp/vrendprobe /tmp/limina/spikes/virgl-zink-kk/vrendprobe.c \
              -I"$GITHUB_WORKSPACE/third_party/virgl-prefix/include/virgl" \
              -L"$GITHUB_WORKSPACE/third_party/virgl-prefix/lib" -lvirglrenderer \
              -Wl,-rpath,"$GITHUB_WORKSPACE/third_party/virgl-prefix/lib"
          export VK_DRIVER_FILES="$MESA_PREFIX/share/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json"
          export DYLD_LIBRARY_PATH="$MESA_PREFIX/vulkan-rpath"
          export DYLD_FALLBACK_LIBRARY_PATH="$MESA_PREFIX/lib:$GITHUB_WORKSPACE/third_party/epoxy-egl-prefix/lib:$(brew --prefix)/lib"
          export MESA_LOADER_DRIVER_OVERRIDE=zink
          export GALLIUM_DRIVER=zink
          export LIBGL_DRIVERS_PATH="$MESA_PREFIX/lib"
          export EGL_PLATFORM=surfaceless
          /tmp/vrendprobe

      # The roadmap's step 2. Reaching this at all means every link above held.
      #
      # `tests` defaults to false in the C's meson_options.txt, so build-reference.sh does not
      # build them and a bare `meson test` would find nothing to run and exit 0 — a green that
      # measured nothing. Reconfigure the same build dir with them on, which also needs the
      # PKG_CONFIG_PATH that script exported into its own process and not this one.
      - name: Run the C tree's own tests
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/third_party/epoxy-egl-prefix/lib/pkgconfig:$MESA_PREFIX/lib/pkgconfig:$(brew --prefix)/opt/molten-vk/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig"
          meson configure third_party/virglrenderer/build -Dtests=true
          ninja -C third_party/virglrenderer/build
          meson test -C third_party/virglrenderer/build --list
          export VK_DRIVER_FILES="$MESA_PREFIX/share/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json"
          export DYLD_LIBRARY_PATH="$MESA_PREFIX/vulkan-rpath"
          export DYLD_FALLBACK_LIBRARY_PATH="$MESA_PREFIX/lib:$GITHUB_WORKSPACE/third_party/epoxy-egl-prefix/lib:$(brew --prefix)/lib"
          export MESA_LOADER_DRIVER_OVERRIDE=zink
          export GALLIUM_DRIVER=zink
          export LIBGL_DRIVERS_PATH="$MESA_PREFIX/lib"
          export EGL_PLATFORM=surfaceless
          meson test -C third_party/virglrenderer/build --print-errorlogs

      - name: What it cost
        if: always()
        run: |
          df -h / "$MESA_CS" || true
          du -sh "$MESA_PREFIX" "$MESA_CS/build-zink-kk" 2>/dev/null || true
